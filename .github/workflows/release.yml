name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: pychat-linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: pychat-linux-arm64
          - runner: macos-14
            artifact: pychat-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.13'
      - name: Build the standalone binary
        run: uv run --locked --group packaging pyinstaller --noconfirm --clean pychat.spec
      - name: Smoke test the binary
        run: uv run pytest -q tests/test_binary.py
      - name: Stage the release asset
        run: |
          # A download cannot carry a file mode, so the raw asset needs chmod +x.
          # The archive records the mode, which is why it is the friendlier one.
          mkdir -p release package
          cp dist/pychat "release/${{ matrix.artifact }}"
          cp dist/pychat package/pychat
          chmod 755 package/pychat
          tar -czf "release/${{ matrix.artifact }}.tar.gz" -C package pychat
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # The tag is the project version (`v0.1.2`); the release is the tool.
          name: pychat ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
